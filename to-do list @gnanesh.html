<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Web App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        h2 {
            color: #007bff;
            text-align: center;
        }
        .completed {
            text-decoration: line-through;
            color: grey;
            background-color: #d4edda;
        }
        .btn-group .btn {
            transition: 0.3s;
        }
        .btn-group .btn:hover {
            background-color: #0056b3;
            color: white;
        }
        .list-group-item {
            transition: 0.3s;
            border-radius: 5px;
        }
        .list-group-item:hover {
            background-color: #f1f1f1;
        }
        .delete-task {
            transition: 0.3s;
        }
        .delete-task:hover {
            background-color: red;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>To-Do List</h2>
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task">
            <button class="btn btn-primary" id="addTask">Add Task</button>
        </div>
        
        <div class="btn-group mb-3" role="group">
            <button class="btn btn-secondary filter-btn" data-filter="all">All</button>
            <button class="btn btn-secondary filter-btn" data-filter="completed">Completed</button>
            <button class="btn btn-secondary filter-btn" data-filter="pending">Pending</button>
        </div>
        
        <ul class="list-group" id="taskList"></ul>
    </div>

    <script>
        $(document).ready(function() {
            loadTasks();

            $('#addTask').click(function() {
                let taskText = $('#taskInput').val().trim();
                if (taskText !== '') {
                    addTask(taskText, false);
                    $('#taskInput').val('');
                }
            });

            $(document).on('click', '.delete-task', function() {
                $(this).closest('li').remove();
                saveTasks();
            });

            $(document).on('click', '.task-item', function() {
                $(this).toggleClass('completed');
                saveTasks();
            });

            $('.filter-btn').click(function() {
                let filter = $(this).data('filter');
                filterTasks(filter);
            });
        });

        function addTask(taskText, completed) {
            let taskItem = `<li class="list-group-item d-flex justify-content-between align-items-center task-item ${completed ? 'completed' : ''}">
                                <span class="task-text">${taskText}</span>
                                <button class="btn btn-danger btn-sm delete-task">Delete</button>
                            </li>`;
            $('#taskList').append(taskItem);
            saveTasks();
        }

        function saveTasks() {
            let tasks = [];
            $('#taskList .task-item').each(function() {
                tasks.push({
                    text: $(this).find('.task-text').text().trim(),
                    completed: $(this).hasClass('completed')
                });
            });
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        function loadTasks() {
            let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
            $('#taskList').empty();
            tasks.forEach(task => addTask(task.text, task.completed));
        }

        function filterTasks(filter) {
            $('.task-item').each(function() {
                let isCompleted = $(this).hasClass('completed');
                if (filter === 'all') {
                    $(this).show();
                } else if (filter === 'completed') {
                    $(this).toggle(isCompleted);
                } else if (filter === 'pending') {
                    $(this).toggle(!isCompleted);
                }
            });
        }
    </script>
</body>
</html>
